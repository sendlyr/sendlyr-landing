<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Find the customer-journey leak worth fixing first</title>
  <desc id="description">Sendlyr turns existing product behavior into one priority state, one next action, and one measurable test.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0b1316" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f6f7f5"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <text x="70" y="77" fill="#0b1316" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">Sendlyr</text>
  <text x="1128" y="75" fill="#0b5f66" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2" text-anchor="end">ACTIVATION · CONVERSION · RETENTION</text>
  <text x="70" y="188" fill="#0b5f66" font-family="monospace" font-size="16" font-weight="700" letter-spacing="2">THE FIRST DECISION</text>
  <text x="70" y="270" fill="#0b1316" font-family="Georgia,serif" font-size="66" font-style="italic" letter-spacing="-2">Find the customer-journey</text>
  <text x="70" y="341" fill="#0b1316" font-family="Georgia,serif" font-size="66" font-style="italic" letter-spacing="-2">leak worth fixing first.</text>
  <g transform="translate(70 406)">
    <rect width="1060" height="118" rx="12" fill="#ffffff" stroke="#0b1316"/>
    <rect x="16" y="17" width="254" height="84" rx="7" fill="#e6f1f0"/>
    <text x="35" y="48" fill="#0b5f66" font-family="monospace" font-size="12" font-weight="700">PRIORITY STATE</text>
    <text x="35" y="78" fill="#0b1316" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="750">Unstarted</text>
    <path d="M286 59h47" stroke="#0b5f66" stroke-width="2"/>
    <path d="m326 52 7 7-7 7" fill="none" stroke="#0b5f66" stroke-width="2"/>
    <rect x="348" y="17" width="352" height="84" rx="7" fill="#10191c"/>
    <text x="368" y="48" fill="#40a8aa" font-family="monospace" font-size="12" font-weight="700">NEXT ACTION</text>
    <text x="368" y="72" fill="#ffffff" font-family="Georgia,serif" font-size="20" font-style="italic">Guide the shortest path</text>
    <text x="368" y="94" fill="#ffffff" font-family="Georgia,serif" font-size="20" font-style="italic">to first value</text>
    <path d="M716 59h47" stroke="#6d5bd0" stroke-width="2"/>
    <path d="m756 52 7 7-7 7" fill="none" stroke="#6d5bd0" stroke-width="2"/>
    <rect x="778" y="17" width="266" height="84" rx="7" fill="#6d5bd0"/>
    <text x="798" y="48" fill="#efedfb" font-family="monospace" font-size="12" font-weight="700">MEASURABLE TEST</text>
    <text x="798" y="78" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750">Human-approved</text>
  </g>
  <path d="M1110 535v22c0 22-17 34-42 34H615c-24 0-36-12-36-35v-14" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <path d="m571 551 8-9 8 9" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text x="831" y="613" fill="#6d5bd0" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">ONE PRIORITY STATE. ONE NEXT ACTION. ONE MEASURABLE TEST.</text>
</svg>
